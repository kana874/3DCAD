name: Face extrusion verification
on:
  pull_request:
    paths:
      - 'play-gui/cad/**'
      - 'tests/cad_face_e2e.cjs'
      - '.github/workflows/face-diagnostic.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -f Dockerfile.ja -t freecad-web-ja:face .
      - name: Prepare test site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cid=$(docker create freecad-web-ja:face)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid":/usr/share/nginx/html/. _site/
          cp pages/sw.js pages/coi-boot.js _site/
          python3 scripts/build_pages.py _site --base /3DCAD/ --version 1.0.8-ja1
      - run: npm ci --ignore-scripts
      - name: Verify face extrusion
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/cad_face_e2e.cjs _site
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-test-evidence
          path: cad-test-output/
          if-no-files-found: ignore
